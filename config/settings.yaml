app_env: local
log_level: INFO

paths:
  data_dir: ./data
  index_dir: ./data/indices

llama_cpp:
  base_url: http://127.0.0.1:8080
  embed_base_url: ""  # optional dedicated embedding endpoint; falls back to base_url
  llm_model: ""  # recommended: set to the id returned by /v1/models
  embed_model: ""  # optional; when empty, backend auto-picks an embedding model if available
  timeout_s: 120
  rpc_targets: []

rag:
  top_k: 4
  chunk_size: 320
  chunk_overlap: 64
  min_score: 0.0
